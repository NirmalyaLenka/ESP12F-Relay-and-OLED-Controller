<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP12F Relay Control</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #1c1c1c;
    color: #eeeeee;
    text-align: center;
    padding: 20px;
    margin: 0;
  }
  h1 {
    font-size: 20px;
    font-weight: normal;
  }
  #clock {
    font-size: 30px;
    margin: 10px 0 20px;
  }
  .relay-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 320px;
    margin: 10px auto;
    padding: 12px 16px;
    background: #2a2a2a;
    border-radius: 6px;
  }
  .relay-name {
    font-size: 16px;
  }
  .switch {
    position: relative;
    width: 50px;
    height: 26px;
  }
  .switch input {
    display: none;
  }
  .slider {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #555555;
    border-radius: 26px;
    transition: 0.2s;
    cursor: pointer;
  }
  .slider::before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .slider {
    background-color: #4caf50;
  }
  input:checked + .slider::before {
    transform: translateX(24px);
  }
</style>
</head>
<body>
  <h1>ESP12F Relay Control Panel</h1>
  <div id="clock">--:--:--</div>
  <div id="relays"></div>

<script>
function buildRelayRows() {
  const container = document.getElementById("relays");
  for (let i = 1; i <= 5; i++) {
    const row = document.createElement("div");
    row.className = "relay-row";
    row.innerHTML =
      '<span class="relay-name">Relay ' + i + '</span>' +
      '<label class="switch">' +
        '<input type="checkbox" id="relay' + i + '" onchange="toggleRelay(' + i + ')">' +
        '<span class="slider"></span>' +
      '</label>';
    container.appendChild(row);
  }
}

function toggleRelay(num) {
  fetch("/toggle?relay=" + num)
    .then(function (response) { return response.json(); })
    .then(updateUI);
}

function refreshStatus() {
  fetch("/status")
    .then(function (response) { return response.json(); })
    .then(updateUI);
}

function updateUI(data) {
  document.getElementById("clock").textContent = data.time;
  for (let i = 0; i < 5; i++) {
    document.getElementById("relay" + (i + 1)).checked = data.relays[i];
  }
}

buildRelayRows();
refreshStatus();
setInterval(refreshStatus, 1000);
</script>
</body>
</html>
